# ============================================
# 评审标准配置
# ============================================
evaluation:
  criteria:
    - name: "选题质量"
      weight: 0.15
      max_score: 100
      description: "选题的创新性、实用性和可行性"
      
    - name: "文献综述"
      weight: 0.15
      max_score: 100
      description: "文献调研的全面性和深度"
      
    - name: "研究方法"
      weight: 0.20
      max_score: 100
      description: "研究方法的科学性和合理性"
      
    - name: "论文结构"
      weight: 0.15
      max_score: 100
      description: "论文结构的完整性和逻辑性"
      
    - name: "内容质量"
      weight: 0.25
      max_score: 100
      description: "论文内容的深度和创新性"
      
    - name: "写作规范"
      weight: 0.10
      max_score: 100
      description: "格式规范、语言表达和引用规范"

  # 总分范围
  total_score_range:
    min: 0
    max: 100

  # 评级标准
  grade_levels:
    - grade: "优秀"
      min_score: 90
    - grade: "良好"
      min_score: 80
    - grade: "中等"
      min_score: 70
    - grade: "及格"
      min_score: 60
    - grade: "不及格"
      min_score: 0

# ============================================
# 参数说明
# ============================================
# temperature: 控制输出的随机性，0-1之间
#   - 0.3: 更确定、一致的输出（推荐用于评审）
#   - 0.7: 更有创造性的输出
#   - 1.0: 最大随机性
#
# max_tokens: 最大输出长度
#   - 建议: 1500-2500
#   - 过小: 评价可能不完整
#   - 过大: 增加成本和响应时间
#
# weight: 各项权重，总和必须为1.0
#
# max_score: 各项满分，建议统一为100
