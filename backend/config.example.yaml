# 大模型配置示例文件
# 复制此文件为 config.yaml 并填入你的配置

# ============================================
# OpenAI 配置示例
# ============================================
llm:
  api_key: "sk-xxxxxxxxxxxxxxxx"
  base_url: "https://api.openai.com/v1"
  model: "gpt-4"  # 或 gpt-3.5-turbo
  temperature: 0.3
  max_tokens: 2000

