services:
  backend:
    build: ./backend
    container_name: thesis-review-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 挂载配置文件，使导入的评审标准持久化
      - ./backend/config.yaml:/app/config.yaml
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    container_name: thesis-review-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: thesis-review-network
